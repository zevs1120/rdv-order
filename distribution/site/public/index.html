<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdf">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Resort Déjà Vu team app downloads.">
  <title>Team Apps · Resort Déjà Vu</title>
  <link rel="icon" href="/rdv-logo.webp" type="image/webp">
  <link rel="stylesheet" href="/style.css">
  <script src="/language.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="https://www.resortdejavu.cn/" aria-label="Resort Déjà Vu">
        <img src="/rdv-logo.webp" alt="Resort Déjà Vu" width="64" height="35">
      </a>
      <button id="language" type="button" aria-label="切换到中文" hidden>中</button>
    </header>
    <main>
      <div class="app-selector">
        <div class="app-tabs" role="tablist" aria-label="Applications" data-label-en="Applications" data-label-zh="选择应用">
          <button id="tab-order" type="button" role="tab" aria-selected="true" aria-controls="panel-order" data-en="Ordering app" data-zh="点餐软件">Ordering app</button>
          <button id="tab-staff" type="button" role="tab" aria-selected="false" aria-controls="panel-staff" tabindex="-1" data-en="Staff app" data-zh="员工应用">Staff app</button>
        </div>
      </div>
      <section id="panel-order" class="app-panel" role="tabpanel" aria-labelledby="tab-order" tabindex="0">
        <div class="app-symbol"><img src="/assets/branding/rdv-order-icon.png" alt="" width="80" height="80"></div>
        <h1>RDV <em>Order</em></h1>
        <p class="app-intro" data-en="Made for the tables at Resort Déjà Vu. Let every order move with ease, and every thoughtful touch arrive in order." data-zh="为 Resort Déjà Vu 的餐桌而作。让每一次点单更轻盈，让每一份用心都有序抵达。">为 Resort Déjà Vu 的餐桌而作。让每一次点单更轻盈，让每一份用心都有序抵达。</p>
        <a class="download" href="/releases/rdv-order-0.1.2.apk" download="rdv-order-0.1.2.apk">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-en="Download for Android" data-zh="下载安卓安装包">Download for Android</span><span class="button-arrow" aria-hidden="true">↗</span>
        </a>
        <p class="release">v0.1.2 <span>·</span> 1.43 MB <span>·</span> Android 8.0+</p>
      </section>
      <section id="panel-staff" class="app-panel" role="tabpanel" aria-labelledby="tab-staff" tabindex="0" hidden>
        <div class="app-symbol staff-symbol" aria-hidden="true">✦</div>
        <h1 data-en="Staff app" data-zh="员工应用">Staff app</h1>
        <p class="coming-soon" data-en="In the making" data-zh="制作中">In the making</p>
      </section>
      <noscript><p class="noscript-note">Staff app: in the making. / 员工应用：制作中。</p></noscript>
    </main>
    <footer><span>RESORT DÉJÀ VU</span><span>SIQUIJOR, PHILIPPINES</span></footer>
  </div>
</body>
</html>
