  <div class="page">

        <a class="download" href="/releases/rdv-order-0.1.4.apk" download="rdv-order-0.1.4.apk">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-en="Download for Android" data-zh="下载安卓安装包">Download for Android</span><svg class="button-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 19 19 5M9 5h10v10" stroke-linecap="round" stroke-linejoin="round"/></svg>
